name: Platform CI

# Scoped to platform/ so it does not run on changes to frontend/.
#
# On pushes to main (or a manual run), a successful check is followed by a
# latency comparison in one job:
#
#   1. start synthetic traffic against APP_URL (when configured) and let it
#      build a baseline for WARMUP_MINUTES;
#   2. trigger the deploy (DEPLOY_HOOK_URL) and wait until APP_URL/api/version
#      reports this commit, so the comparison window measures the new build;
#   3. keep traffic flowing for BAKE_MINUTES, then compare p95 per operation.
#
# On regression, the gate triggers Agent0 RCA and fails the job.
#
# Configuration:
#   vars:    DASH0_OTLP_URL, DASH0_API_URL, DASH0_DATASET (optional),
#            AGENT0_WEBHOOK_URL, BAKE_MINUTES (optional),
#            DEPLOY_HOOK_URL (optional; skip to check latency without deploying),
#            APP_URL (optional; public URL of the deployed app, enables the
#                     deploy-live wait and CI-generated traffic),
#            WARMUP_MINUTES (optional), DEPLOY_WAIT_MINUTES (optional)
#   secrets: DASH0_AUTH_TOKEN, AGENT0_WEBHOOK_SECRET, SLACK_WEBHOOK_URL (optional),
#            ELASTICSEARCH_URL (optional; the deployed app's ES, read by the
#                               traffic generator to pick real users and talks)
#
# Without APP_URL + ELASTICSEARCH_URL, the gate relies on traffic the app
# already gets in both windows.
on:
  push:
    branches: [main]
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  workflow_dispatch:
    inputs:
      bake_minutes:
        description: Minutes in the comparison window after the new build is live
        default: '10'
      fail_on_regression:
        description: Fail the run when latency regresses
        type: boolean
        default: true

defaults:
  run:
    working-directory: platform

env:
  SERVICE_NAME: confluence
  SERVICE_NAMESPACE: converge
  DEPLOYMENT_ENV: hackathon

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build must not require a running Elasticsearch — every page is
          # rendered per request.
          ELASTICSEARCH_URL: http://localhost:9200

  latency:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One run at a time, so comparison windows do not overlap.
    concurrency: latency-${{ github.ref }}
    env:
      APP_URL: ${{ vars.APP_URL }}
      BAKE_MINUTES: ${{ inputs.bake_minutes || vars.BAKE_MINUTES || '10' }}
      WARMUP_MINUTES: ${{ vars.WARMUP_MINUTES || '10' }}
      DEPLOY_WAIT_MINUTES: ${{ vars.DEPLOY_WAIT_MINUTES || '15' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - run: npm ci

      # Runs in the background for the rest of the job, so both the baseline
      # and the comparison window have samples.
      - name: Start synthetic traffic
        id: traffic
        env:
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$ELASTICSEARCH_URL" ]; then
            echo "APP_URL or ELASTICSEARCH_URL not set — relying on existing traffic."
            echo "started=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Single process (no tsx wrapper), so SIGINT reaches the generator.
          nohup node --import tsx scripts/traffic.ts --base "$APP_URL" --workers 4 \
            > "$RUNNER_TEMP/traffic.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/traffic.pid"
          sleep 15
          if ! kill -0 "$(cat "$RUNNER_TEMP/traffic.pid")" 2>/dev/null; then
            echo "::warning::Traffic generator exited early; relying on existing traffic."
            cat "$RUNNER_TEMP/traffic.log"
            echo "started=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Build baseline (${{ env.WARMUP_MINUTES }} min)
        if: steps.traffic.outputs.started == 'true' && vars.DASH0_API_URL != ''
        run: sleep $(( WARMUP_MINUTES * 60 ))

      - name: Deploy (when configured)
        id: deploy
        env:
          DEPLOY_HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
        run: |
          echo "baseline_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
            echo "Deploy hook called."
          else
            echo "No DEPLOY_HOOK_URL set — continuing with a latency check only."
          fi

      # Deploy hooks return as soon as the build is queued. Start the comparison
      # window only once the new build is actually serving traffic.
      - name: Wait for ${{ github.sha }} to be live
        id: live
        if: vars.DEPLOY_HOOK_URL != ''
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::APP_URL not set — cannot confirm the deploy is live; the window starts at the deploy trigger."
            exit 0
          fi
          deadline=$(( $(date +%s) + DEPLOY_WAIT_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            version=$(curl -fsS --max-time 10 "$APP_URL/api/version" 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{}})')
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "$GITHUB_SHA is live."
              exit 0
            fi
            echo "Serving ${version:-unreachable}; waiting for $GITHUB_SHA…"
            sleep 20
          done
          echo "::error::$GITHUB_SHA was not live at $APP_URL after $DEPLOY_WAIT_MINUTES minutes. Check that the host sets APP_VERSION (or its git SHA variable)."
          exit 1

      - name: Record latency window start
        id: mark
        run: echo "window_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Send Dash0 deployment event
        if: always() && vars.DEPLOY_HOOK_URL != '' && vars.DASH0_OTLP_URL != '' && steps.deploy.outcome != 'skipped'
        uses: dash0hq/dash0-cli/.github/actions/send-log-event@v1.20.0
        with:
          otlp-url: ${{ vars.DASH0_OTLP_URL }}
          auth-token: ${{ secrets.DASH0_AUTH_TOKEN }}
          dataset: ${{ vars.DASH0_DATASET || 'default' }}
          event-name: dash0.deployment
          body: Deployed ${{ env.SERVICE_NAME }} ${{ github.sha }} (${{ steps.live.outcome == 'success' && 'live' || steps.deploy.outcome }})
          severity-number: ${{ steps.deploy.outcome == 'success' && steps.live.outcome == 'success' && '9' || '17' }}
          service-name: ${{ env.SERVICE_NAME }}
          service-namespace: ${{ env.SERVICE_NAMESPACE }}
          service-version: ${{ github.sha }}
          deployment-environment-name: ${{ env.DEPLOYMENT_ENV }}
          deployment-name: ${{ env.SERVICE_NAME }}
          deployment-id: ${{ github.run_id }}-${{ github.run_attempt }}
          deployment-status: ${{ steps.deploy.outcome == 'success' && steps.live.outcome == 'success' && 'succeeded' || 'failed' }}
          vcs-repository-url: ${{ github.server_url }}/${{ github.repository }}
          vcs-ref-head-revision: ${{ github.sha }}
          vcs-ref-head-name: ${{ github.ref_name }}
          other-log-attributes: |
            cicd.pipeline.run.url.full=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            vcs.ref.base.revision=${{ github.event.before }}

      - name: Mark Dash0 latency window
        if: vars.DEPLOY_HOOK_URL == '' && vars.DASH0_OTLP_URL != ''
        uses: dash0hq/dash0-cli/.github/actions/send-log-event@v1.20.0
        with:
          otlp-url: ${{ vars.DASH0_OTLP_URL }}
          auth-token: ${{ secrets.DASH0_AUTH_TOKEN }}
          dataset: ${{ vars.DASH0_DATASET || 'default' }}
          event-name: converge.latency_window.start
          body: Latency comparison window started for ${{ env.SERVICE_NAME }} at ${{ steps.mark.outputs.window_start }}
          severity-number: '9'
          service-name: ${{ env.SERVICE_NAME }}
          service-namespace: ${{ env.SERVICE_NAMESPACE }}
          service-version: ${{ github.sha }}
          deployment-environment-name: ${{ env.DEPLOYMENT_ENV }}
          other-log-attributes: |
            app.gate.window.start=${{ steps.mark.outputs.window_start }}
            cicd.pipeline.run.url.full=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Collect comparison window (${{ env.BAKE_MINUTES }} min)
        if: vars.DASH0_API_URL != ''
        run: sleep $(( BAKE_MINUTES * 60 ))

      - name: Compare p95 latency across the CI window
        id: gate
        if: vars.DASH0_API_URL != ''
        env:
          DASH0_API_URL: ${{ vars.DASH0_API_URL }}
          DASH0_AUTH_TOKEN: ${{ secrets.DASH0_AUTH_TOKEN }}
          DASH0_DATASET: ${{ vars.DASH0_DATASET || 'default' }}
          GATE_SERVICE_NAME: ${{ env.SERVICE_NAME }}
          BASELINE_END: ${{ steps.deploy.outputs.baseline_end }}
          # With CI-generated traffic, the baseline is exactly the warm-up.
          BASELINE_MINUTES: ${{ steps.traffic.outputs.started == 'true' && env.WARMUP_MINUTES || '' }}
          WINDOW_START: ${{ steps.mark.outputs.window_start }}
          COMPARISON_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PREVIOUS_SHA: ${{ github.event.before }}
          FAIL_ON_REGRESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_on_regression == false && 'false' || 'true' }}
          AGENT0_WEBHOOK_URL: ${{ vars.AGENT0_WEBHOOK_URL }}
          AGENT0_WEBHOOK_SECRET: ${{ secrets.AGENT0_WEBHOOK_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run deploy:gate

      - name: Stop synthetic traffic
        if: always() && steps.traffic.outputs.started == 'true'
        run: |
          kill -INT "$(cat "$RUNNER_TEMP/traffic.pid")" 2>/dev/null || true
          sleep 5
          kill "$(cat "$RUNNER_TEMP/traffic.pid")" 2>/dev/null || true
          tail -c 2000 "$RUNNER_TEMP/traffic.log" | tr '\r' '\n' | tail -5

      # The gate's verdict also lands on the Dash0 timeline.
      - name: Send latency gate result to Dash0
        if: always() && vars.DASH0_OTLP_URL != '' && steps.gate.outcome != 'skipped'
        uses: dash0hq/dash0-cli/.github/actions/send-log-event@v1.20.0
        with:
          otlp-url: ${{ vars.DASH0_OTLP_URL }}
          auth-token: ${{ secrets.DASH0_AUTH_TOKEN }}
          dataset: ${{ vars.DASH0_DATASET || 'default' }}
          event-name: converge.latency_gate
          body: >-
            Latency gate for ${{ github.sha }}:
            ${{ steps.gate.outputs.regressed == 'true' && 'regression detected' || steps.gate.outputs.regressed == 'false' && 'no regression' || 'inconclusive' }}${{ steps.gate.outputs.agent0 == 'true' && ', Agent0 RCA triggered' || '' }}
          severity-number: ${{ steps.gate.outputs.regressed == 'true' && '13' || '9' }}
          service-name: ${{ env.SERVICE_NAME }}
          service-namespace: ${{ env.SERVICE_NAMESPACE }}
          service-version: ${{ github.sha }}
          deployment-environment-name: ${{ env.DEPLOYMENT_ENV }}
          other-log-attributes: |
            app.gate.regressed=${{ steps.gate.outputs.regressed || 'unknown' }}
            app.gate.bake_minutes=${{ env.BAKE_MINUTES }}
            cicd.pipeline.run.url.full=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

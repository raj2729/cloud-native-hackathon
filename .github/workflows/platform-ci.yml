name: Platform CI

# Scoped to platform/ so it does not run on changes to frontend/.
#
# `check` typechecks, lints and builds on every push and PR.
#
# `latency` catches PRs that make the app slower — without a hosted app. On the
# runner it:
#
#   1. starts a fresh Elasticsearch and seeds it with the deterministic demo data;
#   2. builds the PR's base commit and the PR, and starts both side by side;
#   3. runs a paired A/B for AB_SECONDS (default 25): every page request goes to
#      both builds back to back, so both see the same load (scripts/latency-ab.ts);
#   4. compares p95 per page (scripts/deploy-gate.ts). On regression it calls the
#      Agent0 automation webhook — Agent0 investigates the spans both builds sent
#      to Dash0 (service `confluence-ci`, service.version = commit) and the diff,
#      and posts the RCA to Slack — and fails the PR check.
#
# Configuration:
#   vars:    DASH0_OTLP_URL (span export), DASH0_DATASET (optional),
#            AGENT0_WEBHOOK_URL, AB_SECONDS (optional)
#   secrets: DASH0_AUTH_TOKEN, AGENT0_WEBHOOK_SECRET,
#            SLACK_WEBHOOK_URL (optional; an immediate heads-up before Agent0's RCA)
#
# PRs from forks get no secrets, so the latency job runs only for branches of
# this repository.
on:
  push:
    branches: [main]
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  workflow_dispatch:
    inputs:
      base_ref:
        description: Branch or commit to compare the selected ref against
        default: main
      ab_seconds:
        description: Seconds of paired A/B traffic
        default: '25'
      fail_on_regression:
        description: Fail the run when latency regresses
        type: boolean
        default: true

defaults:
  run:
    working-directory: platform

env:
  SERVICE_NAME: confluence-ci
  SERVICE_NAMESPACE: converge
  DEPLOYMENT_ENV: ci

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The build must not require a running Elasticsearch — every page is
          # rendered per request.
          ELASTICSEARCH_URL: http://localhost:9200

  latency:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push to the same PR supersedes the running comparison.
    concurrency:
      group: latency-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    services:
      elasticsearch:
        image: public.ecr.aws/elastic/elasticsearch:9.5.1
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          # No ML: semantic ranking stays off, so the e5 model finishing its
          # deployment mid-run cannot make one build look slower.
          xpack.ml.enabled: 'false'
          ES_JAVA_OPTS: -Xms1g -Xmx1g
          cluster.routing.allocation.disk.threshold_enabled: 'false'
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      ELASTICSEARCH_URL: http://localhost:9200
      AI_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      AB_SECONDS: ${{ inputs.ab_seconds || vars.AB_SECONDS || '25' }}
      # The app's OTel SDK (instrumentation.node.ts) ships spans to Dash0.
      DASH0_ENDPOINT: ${{ vars.DASH0_OTLP_URL }}
      DASH0_AUTH_TOKEN: ${{ secrets.DASH0_AUTH_TOKEN }}
      DASH0_DATASET: ${{ vars.DASH0_DATASET || 'default' }}
      OTEL_SERVICE_NAME: confluence-ci
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Check configuration
        run: |
          # The verdict needs nothing external; Dash0 and Agent0 power the RCA.
          [ -n "$DASH0_ENDPOINT" ] && [ -n "$DASH0_AUTH_TOKEN" ] || echo "::warning::DASH0_OTLP_URL / DASH0_AUTH_TOKEN not set — no traces for Agent0 to investigate."
          [ -n "${{ vars.AGENT0_WEBHOOK_URL }}" ] || echo "::warning::AGENT0_WEBHOOK_URL not set — regressions will not get an RCA."

      - name: Resolve base commit
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ inputs.base_ref || 'main' }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            sha=$PR_BASE_SHA
          else
            sha=$(git rev-parse "origin/$BASE_REF" 2>/dev/null || git rev-parse "$BASE_REF")
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Comparing base $sha against head $HEAD_SHA"

      - name: Build head
        run: npm ci && npm run build

      - name: Build base
        id: build_base
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ steps.base.outputs.sha }}"
          cd "$RUNNER_TEMP/base/platform"
          npm ci && npm run build

      - name: Set up and seed Elasticsearch
        run: npm run es:setup && npm run es:seed

      # Both builds run side by side; spans go to Dash0 for Agent0's RCA.
      - name: Start base (:3000) and head (:3001)
        run: |
          (cd "$RUNNER_TEMP/base/platform" && APP_VERSION="${{ steps.base.outputs.sha }}" \
            nohup npx next start -p 3000 > "$RUNNER_TEMP/server-base.log" 2>&1 &)
          APP_VERSION="$HEAD_SHA" nohup npx next start -p 3001 > "$RUNNER_TEMP/server-head.log" 2>&1 &
          for port in 3000 3001; do
            for _ in $(seq 1 60); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port/agenda")" != "000" ] && break
              sleep 1
            done
          done

      - name: Paired latency A/B (${{ env.AB_SECONDS }}s)
        run: >-
          npx tsx scripts/latency-ab.ts
          --base http://localhost:3000 --head http://localhost:3001
          --seconds "$AB_SECONDS" --workers 10 --out "$RUNNER_TEMP/latency-ab.json"

      - name: Compare p95 latency (base vs head)
        id: gate
        env:
          GATE_SERVICE_NAME: ${{ env.SERVICE_NAME }}
          GATE_RESULTS_FILE: ${{ runner.temp }}/latency-ab.json
          LATENCY_MIN_SAMPLES: '15'
          BAKE_MINUTES: '1'
          COMMIT_SHA: ${{ env.HEAD_SHA }}
          PREVIOUS_SHA: ${{ steps.base.outputs.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          COMPARISON_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          FAIL_ON_REGRESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_on_regression == false && 'false' || 'true' }}
          AGENT0_WEBHOOK_URL: ${{ vars.AGENT0_WEBHOOK_URL }}
          AGENT0_WEBHOOK_SECRET: ${{ secrets.AGENT0_WEBHOOK_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run deploy:gate

      # Stopping the servers flushes their remaining spans to Dash0.
      - name: Stop servers
        if: always()
        run: pkill -TERM -f "next start" || true

      - name: Server logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/server-*.log; do
            [ -f "$f" ] && { echo "== $f"; tail -40 "$f"; }
          done

      # The gate's verdict also lands on the Dash0 timeline.
      - name: Send latency gate result to Dash0
        if: always() && steps.gate.outcome != 'skipped' && vars.DASH0_OTLP_URL != ''
        uses: dash0hq/dash0-cli/.github/actions/send-log-event@v1.20.0
        with:
          otlp-url: ${{ vars.DASH0_OTLP_URL }}
          auth-token: ${{ secrets.DASH0_AUTH_TOKEN }}
          dataset: ${{ vars.DASH0_DATASET || 'default' }}
          event-name: converge.latency_gate
          body: >-
            Latency gate for ${{ env.HEAD_SHA }} vs ${{ steps.base.outputs.sha }}:
            ${{ steps.gate.outputs.regressed == 'true' && 'regression detected' || steps.gate.outputs.regressed == 'false' && 'no regression' || 'inconclusive' }}${{ steps.gate.outputs.agent0 == 'true' && ', Agent0 RCA triggered' || '' }}
          severity-number: ${{ steps.gate.outputs.regressed == 'true' && '13' || '9' }}
          service-name: ${{ env.SERVICE_NAME }}
          service-namespace: ${{ env.SERVICE_NAMESPACE }}
          service-version: ${{ env.HEAD_SHA }}
          deployment-environment-name: ${{ env.DEPLOYMENT_ENV }}
          vcs-repository-url: ${{ github.server_url }}/${{ github.repository }}
          vcs-ref-head-revision: ${{ env.HEAD_SHA }}
          other-log-attributes: |
            app.gate.regressed=${{ steps.gate.outputs.regressed || 'unknown' }}
            app.gate.ab_seconds=${{ env.AB_SECONDS }}
            vcs.ref.base.revision=${{ steps.base.outputs.sha }}
            cicd.pipeline.run.url.full=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

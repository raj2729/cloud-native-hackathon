name: Platform CI

# Scoped to platform/ so it does not run on changes to frontend/.
#
# `check` typechecks, lints and builds on every push and PR.
#
# `latency` catches PRs that make the app slower — without a hosted app. On the
# runner it:
#
#   1. starts a fresh Elasticsearch and seeds it with the deterministic demo data;
#   2. builds the PR's base commit and the PR itself;
#   3. runs each build in turn under the same synthetic traffic for
#      WINDOW_MINUTES, exporting spans to Dash0 as service `confluence-ci`
#      (service.version = the commit), so base and head are directly comparable;
#   4. compares p95 per operation (scripts/deploy-gate.ts). On regression it
#      calls the Agent0 automation webhook — Agent0 runs the RCA against the
#      traces and the diff and posts to Slack — and fails the PR check.
#
# Configuration:
#   vars:    DASH0_OTLP_URL (ingest), DASH0_API_URL (query), DASH0_DATASET (optional),
#            AGENT0_WEBHOOK_URL, WINDOW_MINUTES (optional, default 5)
#   secrets: DASH0_AUTH_TOKEN, AGENT0_WEBHOOK_SECRET,
#            SLACK_WEBHOOK_URL (optional; an immediate heads-up before Agent0's RCA)
#
# PRs from forks get no secrets, so the latency job runs only for branches of
# this repository.
on:
  push:
    branches: [main]
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  workflow_dispatch:
    inputs:
      base_ref:
        description: Branch or commit to compare the selected ref against
        default: main
      window_minutes:
        description: Minutes of traffic per build
        default: '5'
      fail_on_regression:
        description: Fail the run when latency regresses
        type: boolean
        default: true

defaults:
  run:
    working-directory: platform

env:
  SERVICE_NAME: confluence-ci
  SERVICE_NAMESPACE: converge
  DEPLOYMENT_ENV: ci

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The build must not require a running Elasticsearch — every page is
          # rendered per request.
          ELASTICSEARCH_URL: http://localhost:9200

  latency:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Runs share one Dash0 service name; one at a time keeps windows apart.
    concurrency:
      group: platform-latency
      cancel-in-progress: false
    services:
      elasticsearch:
        image: public.ecr.aws/elastic/elasticsearch:9.5.1
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          # No ML: semantic ranking stays off, so the e5 model finishing its
          # deployment mid-run cannot shift latency between the two windows.
          xpack.ml.enabled: 'false'
          ES_JAVA_OPTS: -Xms1g -Xmx1g
          cluster.routing.allocation.disk.threshold_enabled: 'false'
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      ELASTICSEARCH_URL: http://localhost:9200
      AI_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      WINDOW_MINUTES: ${{ inputs.window_minutes || vars.WINDOW_MINUTES || '5' }}
      # The app's OTel SDK (instrumentation.node.ts) ships spans to Dash0.
      DASH0_ENDPOINT: ${{ vars.DASH0_OTLP_URL }}
      DASH0_AUTH_TOKEN: ${{ secrets.DASH0_AUTH_TOKEN }}
      DASH0_DATASET: ${{ vars.DASH0_DATASET || 'default' }}
      OTEL_SERVICE_NAME: confluence-ci
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Check configuration
        run: |
          missing=""
          [ -n "$DASH0_ENDPOINT" ]   || missing="$missing DASH0_OTLP_URL"
          [ -n "$DASH0_AUTH_TOKEN" ] || missing="$missing DASH0_AUTH_TOKEN"
          [ -n "${{ vars.DASH0_API_URL }}" ] || missing="$missing DASH0_API_URL"
          if [ -n "$missing" ]; then
            echo "::error::Latency check needs:$missing"
            exit 1
          fi
          [ -n "${{ vars.AGENT0_WEBHOOK_URL }}" ] || echo "::warning::AGENT0_WEBHOOK_URL not set — regressions will not get an RCA."

      - name: Resolve base commit
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ inputs.base_ref || 'main' }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            sha=$PR_BASE_SHA
          else
            sha=$(git rev-parse "origin/$BASE_REF" 2>/dev/null || git rev-parse "$BASE_REF")
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Comparing base $sha against head $HEAD_SHA"

      - name: Build head
        run: npm ci && npm run build

      - name: Build base
        id: build_base
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ steps.base.outputs.sha }}"
          cd "$RUNNER_TEMP/base/platform"
          npm ci && npm run build

      - name: Set up and seed Elasticsearch
        run: npm run es:setup && npm run es:seed

      - name: Measure base (${{ env.WINDOW_MINUTES }} min)
        id: base_window
        run: scripts/ci-latency-window.sh base "$RUNNER_TEMP/base/platform" "${{ steps.base.outputs.sha }}" "$WINDOW_MINUTES"

      - name: Measure head (${{ env.WINDOW_MINUTES }} min)
        id: head_window
        run: scripts/ci-latency-window.sh head "$GITHUB_WORKSPACE/platform" "$HEAD_SHA" "$WINDOW_MINUTES"

      # Spans → span metrics in Dash0 takes a moment; let the head window land.
      - name: Wait for Dash0 ingestion
        run: sleep 60

      - name: Compare p95 latency (base vs head)
        id: gate
        env:
          DASH0_API_URL: ${{ vars.DASH0_API_URL }}
          GATE_SERVICE_NAME: ${{ env.SERVICE_NAME }}
          BASELINE_END: ${{ steps.base_window.outputs.base_end }}
          BASELINE_MINUTES: ${{ env.WINDOW_MINUTES }}
          WINDOW_START: ${{ steps.head_window.outputs.head_start }}
          BAKE_MINUTES: ${{ env.WINDOW_MINUTES }}
          COMMIT_SHA: ${{ env.HEAD_SHA }}
          PREVIOUS_SHA: ${{ steps.base.outputs.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          COMPARISON_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          FAIL_ON_REGRESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_on_regression == false && 'false' || 'true' }}
          AGENT0_WEBHOOK_URL: ${{ vars.AGENT0_WEBHOOK_URL }}
          AGENT0_WEBHOOK_SECRET: ${{ secrets.AGENT0_WEBHOOK_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run deploy:gate

      - name: Server logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/server-*.log; do
            [ -f "$f" ] && { echo "== $f"; tail -40 "$f"; }
          done

      # The gate's verdict also lands on the Dash0 timeline.
      - name: Send latency gate result to Dash0
        if: always() && steps.gate.outcome != 'skipped'
        uses: dash0hq/dash0-cli/.github/actions/send-log-event@v1.20.0
        with:
          otlp-url: ${{ vars.DASH0_OTLP_URL }}
          auth-token: ${{ secrets.DASH0_AUTH_TOKEN }}
          dataset: ${{ vars.DASH0_DATASET || 'default' }}
          event-name: converge.latency_gate
          body: >-
            Latency gate for ${{ env.HEAD_SHA }} vs ${{ steps.base.outputs.sha }}:
            ${{ steps.gate.outputs.regressed == 'true' && 'regression detected' || steps.gate.outputs.regressed == 'false' && 'no regression' || 'inconclusive' }}${{ steps.gate.outputs.agent0 == 'true' && ', Agent0 RCA triggered' || '' }}
          severity-number: ${{ steps.gate.outputs.regressed == 'true' && '13' || '9' }}
          service-name: ${{ env.SERVICE_NAME }}
          service-namespace: ${{ env.SERVICE_NAMESPACE }}
          service-version: ${{ env.HEAD_SHA }}
          deployment-environment-name: ${{ env.DEPLOYMENT_ENV }}
          vcs-repository-url: ${{ github.server_url }}/${{ github.repository }}
          vcs-ref-head-revision: ${{ env.HEAD_SHA }}
          other-log-attributes: |
            app.gate.regressed=${{ steps.gate.outputs.regressed || 'unknown' }}
            app.gate.window_minutes=${{ env.WINDOW_MINUTES }}
            vcs.ref.base.revision=${{ steps.base.outputs.sha }}
            cicd.pipeline.run.url.full=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

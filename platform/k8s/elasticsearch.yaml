apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: hackathon
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: converge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: hackathon
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: converge
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: hackathon
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: converge
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: converge
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: public.ecr.aws/elastic/elasticsearch:9.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.enrollment.enabled
              value: "false"
            - name: xpack.license.self_generated.type
              value: trial
            - name: xpack.ml.enabled
              value: "true"
            - name: xpack.ml.use_auto_machine_memory_percent
              value: "true"
            - name: ES_JAVA_OPTS
              value: -Xms1g -Xmx1g
            - name: cluster.routing.allocation.disk.threshold_enabled
              value: "false"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: http
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

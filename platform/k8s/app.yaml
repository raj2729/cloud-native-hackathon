apiVersion: v1
kind: ConfigMap
metadata:
  name: converge
  namespace: hackathon
  labels:
    app.kubernetes.io/name: converge
    app.kubernetes.io/part-of: converge
data:
  ELASTICSEARCH_URL: http://elasticsearch:9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: converge
  namespace: hackathon
  labels:
    app.kubernetes.io/name: converge
    app.kubernetes.io/part-of: converge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: converge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: converge
        app.kubernetes.io/part-of: converge
    spec:
      containers:
        - name: converge
          image: converge:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: converge
          env:
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: converge-secrets
                  key: ELEVENLABS_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: converge
  namespace: hackathon
  labels:
    app.kubernetes.io/name: converge
    app.kubernetes.io/part-of: converge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: converge
  ports:
    - name: http
      port: 3000
      targetPort: http
